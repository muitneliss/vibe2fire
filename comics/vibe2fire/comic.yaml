  - id: danh-trum
    nav: 29/10 chiều
    date: 29/10, chiều
    title: Đánh trùm
    intro: Mỗi nền tảng có một con trùm riêng. Phòng Marketing sẽ mở ticket rồi chờ. Sếp đánh từng con, trong cùng một buổi chiều.

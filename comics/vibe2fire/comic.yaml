chapters:
  - id: sa-mac
    nav: Quý 3
    date: Quý 3/2026
    title: Sa mạc nội dung
    intro: Phòng Marketing có ngân sách, có kế hoạch, có cả slide. Thứ duy nhất họ không có là bài đăng.
    transcript: "Quý 3/2026, Sài Gòn, mùa mưa. Phòng Marketing họp giao ban tuần thứ mười hai liên tiếp. Linh: “Quý này mình đăng hai bài, nếu agency gửi bản kịp.” Mai hỏi AI và nhận về “Trong thời đại số phát triển như vũ bão…”. Linh cấm AI, quay về quy trình cũ. Khoa ngủ gục và nói mớ: một video mất sáu tuần."
    panels:
      - id: c01-p1
        span: 6
        shape: wide
        scene: "Establishing shot of a Saigon street in the rainy-season morning: wet asphalt reflecting light, a stream of motorbikes with riders in raincoats, street-food stall under a tarp, a mid-rise glass office building in the background. Grey-blue overcast light."
        alt: Phố Sài Gòn buổi sáng mùa mưa, dòng xe máy, tòa văn phòng kính phía xa.
        text:
          - cap: Quý 3/2026 – Sài Gòn
            at: tl
          - cap: Mùa mưa. Phòng Marketing họp giao ban, tuần thứ mười hai liên tiếp.
            at: bl
      - id: c01-p2
        span: 4
        shape: wide
        cast:
          - linh
          - mai
          - khoa
        scene: Inside a cramped office meeting room. {linh} (magenta blazer) stands at a whiteboard covered in tiny vague doodles and one very small sad chart, presenting with forced confidence. {mai} (top bun, light-blue shirt, lanyard) sips coffee and scrolls her phone. {khoa} (curly hair, beard, mustard shirt) is asleep in his chair, head tilted back. Fluorescent light, beige walls.
        alt: "Phòng họp: Linh thuyết trình trước bảng trắng gần như trống, Mai lướt điện thoại, Khoa ngủ gật."
        text:
          - say: Quý này mình đăng… hai bài. Nếu agency gửi bản kịp.
            at: tl
            tail: r
      - id: c01-p3
        span: 2
        shape: square
        cast:
          - mai
        scene: Medium close-up of {mai} (not the woman in the magenta blazer). She sits at her laptop, the screen glow showing a chat window filled with an endless wall of generic grey text blocks. She looks bored, chin on her hand, holding a takeaway coffee cup.
        alt: Mai chống cằm chán nản trước màn hình chat AI đầy chữ chung chung.
        text:
          - say: "Em hỏi AI rồi. Nó viết: “Trong thời đại số phát triển như vũ bão…”"
            at: tl
      - id: c01-p4
        span: 2
        shape: square
        cast:
          - linh
        scene: "{linh} with arms crossed, stern, standing next to an office wall where a sheet of paper with a red crossed-out cartoon robot drawing has been taped. Slight low angle."
        alt: Linh khoanh tay, bên cạnh tờ giấy vẽ con robot bị gạch chéo đỏ.
        text:
          - say: Thôi, cấm AI. Làm theo quy trình cũ.
            at: tr
            tail: c
      - id: c01-p5
        span: 4
        shape: wide
        cast:
          - khoa
        scene: "{khoa} (no glasses, no hoodie) slumped over his desk asleep beside a towering stack of paper documents with sticky tabs, a wall calendar behind him with many days crossed out in red, an unfinished storyboard on the desk. Late afternoon light through blinds."
        alt: Khoa ngủ gục bên chồng giấy duyệt cao ngất, lịch treo tường gạch đỏ kín.
        text:
          - say: "Một video: kịch bản, thu âm, dựng, duyệt ba vòng… sáu tuần là nhanh…"
            at: tl
          - sfx: ZZZ
            at: tr

  - id: video-dau-tien
    nav: 29/10 sáng
    date: 29/10, sáng
    title: Video đầu tiên
    intro: Video được dựng bằng code, đọc bằng giọng AI, và phải qua một cổng kiểm tra 42 bước trước khi lên sóng. Kể cả video của sếp.
    transcript: "Bản video đầu tiên đúng nhưng nhạt: không phụ đề, mở bài chậm, dài 51 giây. Cổng kiểm tra đánh trượt. Giọng đọc AI tốn khoảng 0,1 USD mỗi video, và chú thích luôn ghi rõ là giọng AI. Bản hai dài 38,4 giây, qua đủ 42/42 bước. Ngày 1 lên sóng lúc 13:55."
    context: Video dựng bằng Remotion, giọng đọc từ ElevenLabs. Cổng `nv validate` chạy 42 bước kiểm tra trước khi render; mọi câu nói trong video phải truy được về một nguồn trong `content/sources.yaml`, câu nào không có nguồn thì cắt.
    panels:

  - id: con-rong
    nav: 29/10 tối
    date: 29/10, tối
    title: Con rồng ba đầu
    intro: Postiz chính chủ cần sáu container. Sếp đọc youjustneedpostgres.com, rồi quyết định không nuôi rồng nữa.
    transcript: "Con rồng ba đầu Redis, Temporal, Elasticsearch quấn quanh máy chủ. “Ba cái đầu, ba thứ phải nuôi. Mình chỉ cần Postgres.” Con voi Postgres hạ rồng: Postiz được fork, hàng đợi viết lại trên Postgres, qua bốn vòng review và 29 bài test. 20:13, sao lưu xong thì cắt chuyển. Sếp gõ “from now, just auto merge for me”. 20:45, sáu container còn hai."
    context: "Tất cả có thật, trong `docs/log.md` ngày 29/10 và ADR 0018. Trước khi cắt chuyển: một bản sao lưu cơ sở dữ liệu, 33 bài đang chờ, không bài nào đến hạn trong 11 giờ tới. Sau đó: vẫn 33 bài chờ, 0 lỗi, năm kênh còn nguyên."
    panels:
      - id: c07-p1
        span: 6
        shape: wide
        cast:
          - boss
        scene: A gigantic three-headed dragon (one head red, one purple, one orange) coiled around towers of server racks, roaring. {boss} stands small in the foreground, seen from behind, looking up. Epic scale, dark stormy light.
        alt: Con rồng ba đầu đỏ, tím, cam quấn quanh các tháp máy chủ, sếp đứng nhỏ bé phía trước.
        text:
          - cap: Redis. Temporal. Elasticsearch.
            at: tl
          - say: Ba cái đầu, ba thứ phải nuôi.
            at: bl
      - id: c07-p2
        span: 2
        shape: square
        cast:
          - boss
        scene: "{boss} standing beside a giant gentle steel-blue elephant, his hand resting on its trunk, both looking ahead with calm determination. Light breaking through clouds behind them."
        alt: Sếp đứng cạnh con voi xanh thép khổng lồ, tay đặt lên vòi voi.
        text:
          - say: Mình chỉ cần Postgres.
            at: tl
            tail: r
      - id: c07-p3
        span: 4
        shape: wide
        scene: The giant steel-blue elephant charges forward, scattering the three dragon heads which recoil and collapse; dust, debris and heavy speed lines, impact burst in the centre. Explosive action panel.
        alt: Con voi lao tới, ba đầu rồng ngã gục giữa bụi và mảnh vỡ.
        text:
          - sfx: RẦM!
            at: tr
            size: xl
          - cap: Fork Postiz. Hàng đợi viết lại trên Postgres, qua bốn vòng review và 29 bài test.
            at: bl
      - id: c07-p4
        span: 3
        shape: square
        cast:
          - boss
        scene: "A control console at night: {boss}'s hand gripping a big lever, an analog wall clock reading about a quarter past eight, a reel-to-reel backup tape spinning beside him, the two robots watching tensely."
        alt: Bảng điều khiển ban đêm, tay sếp nắm cần gạt, đồng hồ chỉ hơn tám giờ, cuộn băng sao lưu đang quay.
        text:
          - cap: 20:13. Sao lưu xong. Cắt chuyển.
            at: tl
      - id: c07-p5
        span: 3
        shape: square
        cast:
          - boss
          - codex
        scene: "Late night: {boss} leaning back in his chair with a relaxed smirk, typing one-handed on his laptop, {codex} giving a thumbs up next to the keyboard. Warm desk lamp."
        alt: Sếp ngả lưng cười nửa miệng, gõ laptop một tay, robot xanh giơ ngón cái.
        text:
          - say: from now, just auto merge for me.
            at: tl
            tail: r
          - cap: 20:45. Sáu container còn hai. Câu kia thành luôn ADR 0013.
            at: bl

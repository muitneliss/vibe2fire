        scene: "View through a glass office wall: {boss} in the foreground, blurred and out of focus on the left, watching the marketing team ({linh}, {mai}, {khoa}) in the background chatting around a table with snacks and phones, laughing, a meeting that clearly never ends."
        alt: Qua vách kính, cả phòng Marketing đang cười nói quanh bàn đồ ăn vặt.
        text:
          - cap: "Bên kia vách kính: cuộc họp bàn về cuộc họp tiếp theo."
            at: tl
      - id: c02-p4
        span: 2
        shape: tall
        cast:
          - boss
        scene: "Tall panel: {boss} walking alone out of the office building at night in the rain, hood of his navy hoodie up, laptop bag on his shoulder, neon reflections on the wet pavement, determined stride, seen from a low angle."
        alt: Sếp trùm mũ áo hoodie bước ra khỏi tòa nhà trong mưa đêm.
        text:
          - cap: Nếu họ không chịu học công cụ…
            at: tl
          - cap: …thì mình học.
            at: bl
  - id: tu-hoc
    nav: Những đêm
    date: Những đêm
    title: Tự học
    intro: "Sếp không mua khoá học “Làm giàu với ChatGPT”. Sếp mở terminal và học thứ khó nhất trước: giao việc cho rõ."
    transcript: "Hai giờ sáng, ly cà phê thứ tư. Sếp giao repo cho Claude đọc và nhờ Codex phản biện. Hai robot hỏi: mình xây gì? Lần đầu agent làm sai, lần hai cũng sai; sếp nhận ra lỗi là ở cách giao việc. Mỗi quyết định thành một ADR. Ba luật: mọi câu nói có nguồn, mọi video qua cổng kiểm tra, mọi khoá nằm trong vault."
    context: "Đoạn này là thật: mọi quyết định của dự án nằm trong `docs/adr/`, và Claude Code với Codex cùng đọc một file luật duy nhất là `AGENTS.md`. Không có khoá nào nằm trong file hay trong chat; agent gọi API qua vault và không bao giờ thấy giá trị bí mật."
    panels:
      - id: c03-p1
        span: 6
        shape: wide
        cast:
          - boss
        scene: "A small apartment at 2 a.m.: {boss} hunched at a desk in front of a laptop whose screen casts a cool glow on his face, four empty coffee cups lined up, city lights through the window, a cat asleep on a stack of books."
        alt: Căn hộ lúc hai giờ sáng, sếp cúi bên laptop, bốn ly cà phê rỗng, con mèo ngủ trên chồng sách.
        text:
          - cap: 2 giờ sáng. Ly cà phê thứ tư.
            at: tl
          - say: Claude, đọc repo. Codex, cho anh ý kiến thứ hai.
            at: tr
            tail: c
      - id: c03-p2
        span: 3
        shape: square
        cast:
          - boss
          - claude
          - codex
        scene: "Close on the laptop screen at night: {claude} (coral-orange) and {codex} (teal-blue) materialise out of the screen light like friendly holograms, waving at {boss}, whose face is lit from below, surprised."
        alt: Hai robot cam và xanh hiện ra từ ánh sáng màn hình laptop, vẫy tay chào sếp.
        text:
          - say: Em đọc repo rồi. Mình xây gì vậy sếp?
            at: tr
      - id: c03-p3
        span: 3
        shape: square
        cast:
          - boss
        scene: "{boss} frustrated, one hand in his hair, the laptop screen glowing red with error light, crumpled paper balls around the desk, the two robots looking sheepish beside the laptop."
        alt: Sếp vò đầu trước màn hình đỏ báo lỗi, giấy vo tròn khắp bàn, hai robot ngượng ngùng.
        text:
          - cap: Lần đầu, agent làm sai. Lần hai cũng sai.
            at: tl
          - say: Không phải lỗi của nó. Anh giao việc mơ hồ.
            at: br
            tail: up
      - id: c03-p4
        span: 4
        shape: wide
        cast:
          - boss
        scene: "{boss} standing at a wall covered with dozens of index cards and sticky notes connected by string, like a detective board, marker in hand, organising decisions. The two robots sit on the desk watching attentively. Warm lamp light."
        alt: Sếp đứng trước bức tường đầy thẻ ghi chú nối bằng dây, hai robot ngồi trên bàn quan sát.
        text:
          - cap: "Bài học cả phòng chưa từng học: AI là đồng đội, và đồng đội cần luật chơi. Mỗi quyết định thành một ADR."
            at: tl
      - id: c03-p5
        span: 2
        shape: square
        cast:
          - boss
        scene: Over-the-shoulder shot of {boss} pinning three blank white cards in a neat vertical row on a cork board, the robots handing him push pins. Calm, focused mood.
        alt: Sếp ghim ba tấm thẻ trắng thành một cột trên bảng gỗ bần, hai robot đưa đinh ghim.
        text:
          - stack:
              - 1. Mọi câu nói phải có nguồn.
              - 2. Mọi video qua cổng kiểm tra.
              - 3. Mọi khoá nằm trong vault.
            at: tr

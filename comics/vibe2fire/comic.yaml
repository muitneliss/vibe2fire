        scene: Extreme close-up of {boss}'s eyes behind his rectangular black-framed glasses, a monitor's tiny glowing chart reflected in the lenses, one bead of sweat on his forehead, deadpan disbelief. Tight framing, dramatic.
        alt: Cận cảnh mắt sếp sau cặp kính, biểu đồ phản chiếu trong tròng kính, một giọt mồ hôi.
        text:
          - cap: Bốn mươi mốt lượt xem.
            at: tl

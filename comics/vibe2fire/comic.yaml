    nav: Cuối tháng
    date: Cuối tháng
    title: Bốn mươi mốt
    intro: Sếp không cần một báo cáo dài. Một con số là đủ.
    transcript: "Cuối tháng, sếp mở báo cáo: 41 lượt xem. “Tính luôn mẹ anh.” Bên kia vách kính, phòng Marketing đang họp bàn về cuộc họp tiếp theo. Sếp bước ra ngoài trời mưa: nếu họ không chịu học công cụ, thì mình học."
    panels:

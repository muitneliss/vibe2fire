        scene: "A dim editing room: {boss} and both robots sit watching a vertical video playing on a big monitor; the video looks plain and static. {boss} has a flat, unimpressed expression, chin on fist."
        alt: Phòng dựng tối, sếp và hai robot xem một video dọc nhạt nhẽo trên màn hình lớn.
        text:

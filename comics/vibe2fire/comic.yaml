  - id: gio-thi
    nav: …và giờ thì
    date: Hôm nay
    title: …và giờ thì
    transcript: "Văn phòng vắng lúc hoàng hôn. Sếp làm việc với hai robot; vài thùng các-tông còn ở góc. Phòng Marketing giờ là một file markdown: AGENTS.md. Khung cuối: một màn hình trong phòng tối, biểu tượng “terminal spark” toả sáng."
    panels:
      - id: c10-p1
        span: 6
        shape: wide
        cast:
          - boss
          - claude
          - codex
        scene: "An empty open-plan office at golden hour: {boss} alone at a desk with his laptop, {claude} and {codex} working beside him, a few leftover cardboard boxes in the corner, long warm shadows across the empty desks."
        alt: Văn phòng vắng lúc hoàng hôn, sếp ngồi với laptop và hai robot, vài thùng các-tông còn ở góc.
        text:
          - cap: "…và giờ thì: phòng Marketing là một file markdown."
            at: tl
          - cap: AGENTS.md
            at: br
      - id: c10-p2
        span: 6
        shape: wide
        scene: A dark room; a single monitor glows with a large terminal prompt symbol and a mint-green spark that radiates branching light rays across the walls, like a mystical artifact. No people. Quiet, reverent final image.
        alt: Căn phòng tối, một màn hình duy nhất phát sáng biểu tượng dấu nhắc lệnh và tia sáng xanh bạc hà toả khắp tường.
